  </defs>
  <rect width="400" height="300" fill="url(#bgNri)"/>
  <circle cx="340" cy="50" r="90" fill="#60A5FA" opacity="0.08"/>
  <circle cx="50" cy="250" r="70" fill="#60A5FA" opacity="0.06"/>

