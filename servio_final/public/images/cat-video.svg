<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgVideo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12142B"/>
      <stop offset="100%" stop-color="#252860"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgVideo)"/>
  <circle cx="330" cy="50" r="90" fill="#E8A33D" opacity="0.08"/>
  <circle cx="40" cy="260" r="70" fill="#E8A33D" opacity="0.06"/>

  <!-- Film camera body -->
  <rect x="120" y="130" width="140" height="90" rx="14" fill="#1E2147" stroke="#E8A33D" stroke-width="2" opacity="0.9"/>
  <rect x="120" y="130" width="140" height="26" rx="8" fill="#E8A33D" opacity="0.9"/>
  <circle cx="190" cy="180" r="34" fill="#0D0F24"/>
  <circle cx="190" cy="180" r="34" fill="none" stroke="#E8A33D" stroke-width="3"/>
  <circle cx="190" cy="180" r="16" fill="#E8A33D" opacity="0.85"/>
  <circle cx="190" cy="180" r="6" fill="#0D0F24"/>

  <!-- Lens flare -->
  <circle cx="176" cy="166" r="4" fill="#FFFFFF" opacity="0.5"/>

  <!-- Camera flash/light -->
  <rect x="235" y="115" width="30" height="20" rx="4" fill="#1E2147" stroke="#E8A33D" stroke-width="1.5"/>

  <!-- Film strip accents -->
  <g opacity="0.55">
    <rect x="90" y="200" width="20" height="30" rx="3" fill="#E8A33D"/>
    <rect x="94" y="204" width="4" height="4" fill="#12142B"/>
    <rect x="94" y="212" width="4" height="4" fill="#12142B"/>
    <rect x="94" y="220" width="4" height="4" fill="#12142B"/>
    <rect x="290" y="195" width="20" height="35" rx="3" fill="#E8A33D"/>
    <rect x="294" y="200" width="4" height="4" fill="#12142B"/>
    <rect x="294" y="209" width="4" height="4" fill="#12142B"/>
    <rect x="294" y="218" width="4" height="4" fill="#12142B"/>
  </g>

  <!-- Sparkle -->
  <path d="M 300 80 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 z" fill="#E8A33D" opacity="0.85"/>
</svg>
